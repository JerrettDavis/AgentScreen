[platformio]
default_envs = e32r40t
src_dir = src
include_dir = include

[env:e32r40t]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.4.0
  bblanchon/ArduinoJson@^7.3.1
  h2zero/NimBLE-Arduino@^1.4.2
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TOUCH_CS=33
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D USE_HSPI_PORT=1
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I include

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_compat_mode = off
build_flags = -std=c++17
