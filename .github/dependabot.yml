# Group updates and allow newly published packages to age for two days before adoption.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 2
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-dependencies:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 2
    labels: [dependencies, dotnet]
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 2
    labels: [dependencies, javascript]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 2
    labels: [dependencies, tests]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-test-dependencies:
        patterns: ["*"]
